name: Pull Request Template
description: Formulario estándar para nuevos PRs.
title: "[Tipo]: Breve descripción del PR"
body:
  - type: markdown
    attributes:
      value: |
        ## Gracias por tu aporte al proyecto de Front-end.

  - type: textarea
    id: what_does_it_do
    attributes:
      label: ¿Qué hace este PR?
      description: Explica brevemente los cambios introducidos y qué problema resuelve.
      placeholder: "- Añade el nuevo componente...\n- Closes #123"
    validations:
      required: true

  - type: input
    id: wrike_link
    attributes:
      label: Tarea de Wrike
      placeholder: "https://www.wrike.com/open.htm?id=..."
    validations:
      required: true

  - type: input
    id: figma_link
    attributes:
      label: Enlace de Figma
      description: Si el cambio es puramente de código (Chore/Fix interno), puedes dejarlo vacío.
      placeholder: "https://www.figma.com/file/..."
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Captura de pantalla / Evidencia
      description: OBLIGATORIO si no colocaste enlace de Figma arriba. Sube imágenes o un GIF aquí.
      placeholder: Arrastra tus imágenes aquí...
    validations:
      required: false

  - type: dropdown
    id: change_type
    attributes:
      label: Tipo de cambio
      description: Selecciona la opción que mejor describa tu cambio.
      options:
        - "Fix (corrección de errores)"
        - "Feat (nueva funcionalidad)"
        - "Refactor (cambio de código sin impacto visual ni funcional)"
        - "Styles (cambios visuales, SCSS)"
        - "Chore (configuración / dependencias)"
    validations:
      required: true

  - type: textarea
    id: testing_steps
    attributes:
      label: Pasos para probar
      description: Indica detalladamente cómo puede otra persona validar tu código.
      value: |
        1. Ve a la ruta: `/tu-ruta`
        2. Haz clic en el botón X.
        3. Verifica que el resultado sea Y.
    validations:
      required: true
